<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'adhérents</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <h1>Club Sportif</h1>
        <hr>
        <nav>
            <a href="#">Acceuil</a> |
            <a href="#">Activités</a> |
            <a href="#">À Propos</a> |
            <a href="#">Inscription</a>
        </nav>
        <hr>
        <img src="../assets/img/logo.png" alt="club logo">
    </header>
    <hr>
    <h2>Formulaire adhérent</h2>

    <form id="adh-form" action="#" method="post">
        <label for="">Nom</label>
        <input type="text" minlength="2" maxlength="30" pattern="[a-zA-Z -]+" required>
        <br>

        <label for="">Prénom</label>
        <input type="text" minlength="2" maxlength="30" pattern="[a-zA-Z -]+" required>
        <br>

        <label for="">Email</label>
        <input type="text" pattern=".+@(gmail\.com|outlook\.com|yahoo\.com|icloud\.com)" minlength="11" maxlength="255" required>
        <br>

        <label for="">Téléphone</label>
        <input type="tel" pattern="[(0-9)]{8,15}" required>
        <br>

        <label for="">Activité</label>
        <select name="" id="" required>
            <option value="">-- choisir une activité-- </option>
            <option value="football">Football</option>
            <option value="natation">Natation</option>
            <option value="fitness">Fitness</option>
        </select>


        <div id="adh-form-btns">
            <input type="submit" value="Enregistrer">
            <input type="reset" value="Annuler">
        </div>


    </form>
</body>

</html>
