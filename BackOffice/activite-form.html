<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'activités</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <h1>Club Sportif - BackOffice</h1>
    <hr>
    <a href="#">Retour au site</a>|
    <a href="#">Activités</a>|
    <a href="#">Nouvelle activité</a>|
    <a href="#">Adhérents</a>|
    <a href="#">Nouvel adhérent</a>

    <hr>
    <h2>Formulaire activité</h2>

    <form id="act-form" action="#" method="post">
        <label for="">Nom de l'activité </label>
        <input type="text">
        <br>

        <label for="">Catégorie </label>
        <select name="" id="">
            <option value="">-- choisir -- </option>
            <option value="football">Football</option>
            <option value="natation">Natation</option>
            <option value="fitness">Fitness</option>
        </select>
        <br>

        <label for="">Description</label>
        <textarea name="" id="" rows="5"></textarea>
        <br>

        <label for="">Jour</label>
        <input type="date">
        <br>

        <label for="">Horaire</label>
        <input type="time">
        <br>

        <label for="">Tarif(£/mois)</label>
        <input type="number">
        <label for=""></label>
        <br>

        <label for="">Nombre de places</label>
        <input type="number">
        <label for=""></label>
        <br>

        <div id="act-form-btns">
            <input type="submit" value="Enregistrer">
            <input type="reset" value="Annuler">
        </div>


    </form>
</body>

</html>
