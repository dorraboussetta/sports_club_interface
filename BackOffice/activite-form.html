<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'activités</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <nav class="backoffice-navbar navbar">
        <div class="navbar-inner">
            <h4>Club Sportif</h4>
            <div class="navbar-links return-link">
                <a href="#">Retour au site</a>
            </div>
        </div>



    </nav>
    <div class="backoffice-layout">
        <div class="sidebar">
            <div class="sidebar-brand ">
                <h4>BackOffice</h4>
            </div>

            <div class="sidebar-nav">
                <a href="#">Activités</a>
                <a href="#">Nouvelle activité</a>
                <a href="#">Adhérents</a>
                <a href="#">Nouvel adhérent</a>
            </div>

        </div>

        <div class="main-content">
            <h2>Formulaire activité</h2>

            <div class="form-container">

                <form class="form-card" action="#" method="post">
                    <label for="">Nom de l'activité </label>
                    <input type="text" minlength="3" maxlength="50" pattern="[a-zA-Z0-9 ]+" required>
                    <br>

                    <label for="">Catégorie </label>
                    <select name="" id="" required>
                        <option value="">-- choisir -- </option>
                        <option value="football">Football</option>
                        <option value="natation">Natation</option>
                        <option value="fitness">Fitness</option>
                    </select>
                    <br>

                    <label for="">Description</label>
                    <textarea name="" id="" rows="5" maxlength="300"
                        placeholder="Description de l'activité (max 300 caractères)." required></textarea>
                    <br>

                    <label for="">Jour</label>
                    <select name="" id="">
                        <option value="">--</option>
                        <option value="lundi">Lundi</option>
                        <option value="mardi">Mardi</option>
                        <option value="mercredi">Mercredi</option>
                        <option value="jeudi">Jeudi</option>
                        <option value="vendredi">Vendredi</option>
                        <option value="samedi">Samedi</option>
                        <option value="dimanche">Dimanche</option>
                    </select>
                    <br>

                    <label for="">Horaire</label>
                    <input type="text" placeholder="HH:MM -- HH:MM"
                        pattern="([01][0-9]|2[0-3]):[0-5][0-9] -- ([01][0-9]|2[0-3]):[0-5][0-9]">
                    <br>

                    <label for="">Tarif(£/mois)</label>
                    <input type="number">
                    <label for=""></label>
                    <br>

                    <label for="">Nombre de places</label>
                    <input type="number" min="1" max="200" step="1">
                    <label for=""></label>
                    <br>


                    <div class="form-btn-div">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a class="btn btn-secondary">Annuler</a>
                    </div>




                </form>
            </div>
        </div>
    </div>




</body>

</html>
