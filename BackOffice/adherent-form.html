<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'adhérents</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <nav class="backoffice-navbar navbar">
        <div class="navbar-inner">
            <h4>Club Sportif</h4>
            <div class="navbar-links return-link">
                <a href="#">Retour au site</a>
            </div>
        </div>
    </nav>

    <div class="backoffice-layout">
        <div class="sidebar">
            <div class="sidebar-brand ">
                <h4>BackOffice</h4>
            </div>

            <div class="sidebar-nav">
                <a href="#">Activités</a>
                <a href="#">Nouvelle activité</a>
                <a href="#">Adhérents</a>
                <a href="#">Nouvel adhérent</a>
            </div>

        </div>
        <div class="main-content">
            <h2>Formulaire adhérent</h2>
            <div class="form-container">
                <form class="form-card" action="#" method="post">
                    <label for="">Nom</label>
                    <input type="text" minlength="2" maxlength="30" pattern="[a-zA-Z -]+" required>
                    <br>

                    <label for="">Prénom</label>
                    <input type="text" minlength="2" maxlength="30" pattern="[a-zA-Z -]+" required>
                    <br>

                    <label for="">Email</label>
                    <input type="text" pattern=".+@(gmail\.com|outlook\.com|yahoo\.com|icloud\.com)" minlength="11"
                        maxlength="255" required>
                    <br>

                    <label for="">Téléphone</label>
                    <input type="tel" pattern="[(0-9)]{8,15}" required>
                    <br>

                    <label for="">Activité</label>
                    <select name="" id="" required>
                        <option value="">-- choisir une activité-- </option>
                        <option value="football">Football</option>
                        <option value="natation">Natation</option>
                        <option value="fitness">Fitness</option>
                    </select>


                    <div class="form-btn-div">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a class="btn btn-secondary">Annuler</a>
                    </div>


                </form>
            </div>
        </div>
        </div>



</body>

</html>
